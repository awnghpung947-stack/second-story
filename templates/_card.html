<article class="product-card"><a href="{{ url_for('details',item_id=item.id) }}" class="product-image">{% if item.image %}<img src="{{ url_for('uploaded_file',filename=item.image) }}" alt="{{ item.name }}">{% else %}<div class="image-fallback">SECOND<br>STORY</div>{% endif %}<span class="condition-tag">{{ item.condition }}</span></a><div class="product-meta"><div><h3><a href="{{ url_for('details',item_id=item.id) }}">{{ item.name }}</a></h3><p>{{ item.brand }} · Size {{ item.size }}</p></div><strong>₹{{ '%.0f'|format(item.price) }}</strong></div></article>
