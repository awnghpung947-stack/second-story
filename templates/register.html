{% extends 'base.html' %}{% block title %}Join Second Story{% endblock %}{% block content %}<section class="form-page"><p class="eyebrow">MAKE YOURSELF AT HOME</p><h1>Join the circle.</h1><p class="form-lead">One account to find a favourite or pass one on.</p><form class="main-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Your name<input name="name" required maxlength="100" value="{{ request.form.get('name','') }}"></label><label>Email address<input type="email" name="email" required value="{{ request.form.get('email','') }}"></label><label>Phone number<input name="phone" required maxlength="30" value="{{ request.form.get('phone','') }}"></label><label>Password<input type="password" name="password" required minlength="8"></label><label>Confirm password<input type="password" name="confirm" required></label><button class="button dark full">Create my account</button></form><p class="form-foot">Already a member? <a href="{{ url_for('login') }}">Log in</a></p></section>{% endblock %}
