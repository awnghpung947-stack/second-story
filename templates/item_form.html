{% extends 'base.html' %}{% block title %}{{ 'Edit listing' if item else 'Sell a piece' }}{% endblock %}{% block content %}<section class="form-page wide"><p class="eyebrow">PASS IT ON</p><h1>{{ 'Edit your listing' if item else 'List a piece you love less.' }}</h1><p class="form-lead">A few details help its next person find it.</p><form class="main-form item-form" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Item name<input name="name" maxlength="100" required value="{{ values.get('name','') }}"></label><label>Brand<input name="brand" maxlength="100" required value="{{ values.get('brand','') }}"></label><label>Category<select name="category" required><option value="">Choose one</option>{% for x in categories %}<option {% if values.get('category')==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label>Size<select name="size" required><option value="">Choose one</option>{% for x in sizes %}<option {% if values.get('size')==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label>Condition<select name="condition" required><option value="">Choose one</option>{% for x in conditions %}<option {% if values.get('condition')==x %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></label><label>Price (₹)<input type="number" min="0" step="0.01" name="price" required value="{{ values.get('price','') }}"></label><label class="span-two">Description<textarea name="description" rows="5" maxlength="2000" required>{{ values.get('description','') }}</textarea></label><label class="span-two">Photograph {% if item and item.image %}<span class="hint">Leave empty to keep the current image.</span>{% endif %}<input type="file" name="image" accept=".jpg,.jpeg,.png,.webp" {% if not item %}required{% endif %}></label><button class="button dark span-two">{{ 'Save changes' if item else 'Publish listing' }}</button></form></section>{% endblock %}
